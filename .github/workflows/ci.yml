name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 取消同一分支上被新提交取代的运行，避免排队浪费时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: "offscreen"
  MPLCONFIGDIR: "/tmp/mplcache"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  lint:
    name: 静态检查 + 版本一致性
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖（CI 全量哈希锁）
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --require-hashes -r requirements-ci.lock
      - name: ruff 门禁
        run: .venv/bin/python -m ruff check .
      - name: 版本一致性门禁
        run: .venv/bin/python tools/check_version.py
      - name: 依赖锁哈希与分层
        run: .venv/bin/python tools/check_dependencies.py

  tests:
    name: 全量逐文件回归
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 安装依赖（CI 全量哈希锁）
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --require-hashes -r requirements-ci.lock
      # runner 上没有 Secret Service，用 keyrings.alt 提供后端，使密钥环前缀 +
      # Fernet 往返在 CI 中真实被测（生产仍走系统密钥环）。
      - name: 配置密钥环测试后端
        run: |
          echo "PYTHON_KEYRING_BACKEND=keyrings.alt.file.PlaintextKeyring" >> "$GITHUB_ENV"
      - name: 逐文件执行（单文件一进程）
        run: .venv/bin/python tools/run_tests.py --quiet
      - name: 失败日志留存（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: /tmp/akia_test_logs/
          retention-days: 7

  benchmark:
    name: 性能基线
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 安装依赖（CI 全量哈希锁）
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --require-hashes -r requirements-ci.lock
      - name: 性能基线（tolerance ×4）
        run: .venv/bin/python tools/benchmark.py --tolerance 4

  package-appimage:
    name: AppImage 打包冒烟（仅 tag）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 安装依赖与打包工具
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --require-hashes -r requirements-ci.lock
          sudo apt-get update && sudo apt-get install -y file wget libfuse2
      - name: 构建 AppImage
        run: |
          chmod +x build_appimage.sh
          PATH="$PWD/.venv/bin:$PATH" ./build_appimage.sh
      - name: 启动冒烟（离屏，10 秒内不崩溃即通过）
        run: |
          ls -lh build/*.AppImage
          timeout 10 ./build/AKIA-*-x86_64.AppImage --appimage-extract-and-run || [ $? -eq 124 ]
      - name: 打包完整性校验（动态导入模块必须随包分发）
        run: |
          .venv/bin/python tools/verify_bundle.py --dist build/akia.dist/akia
          cd build && sha256sum -c AKIA-*.AppImage.sha256
      - name: 生成并校验发布溯源清单
        run: |
          .venv/bin/python tools/release_manifest.py \
            --artifact build/AKIA-*-x86_64.AppImage \
            --output build/release-manifest.json \
            --require-tag --require-clean
          .venv/bin/python tools/release_manifest.py \
            --verify build/release-manifest.json \
            --require-tag --require-clean
      - uses: actions/upload-artifact@v4
        with:
          name: AKIA-AppImage
          path: |
            build/AKIA-*-x86_64.AppImage
            build/AKIA-*-x86_64.AppImage.sha256
            build/release-manifest.json
          retention-days: 30

  package-windows:
    name: Windows 安装包冒烟（仅 tag）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 安装依赖与打包工具
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install --require-hashes -r requirements-ci.lock
      - name: 构建 PyInstaller onedir
        run: .venv\Scripts\python build_pyinstaller.py
      - name: 编译 Inno Setup 安装包
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "未找到 Inno Setup: $iscc" }
          & $iscc "packaging\AKIA-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 构建失败: $LASTEXITCODE" }
      - name: 安装并启动冒烟（离屏，10 秒内不崩溃）
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist\AKIA-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "未找到 Windows 安装包" }
          $install = Join-Path $env:RUNNER_TEMP "akia-installed"
          $proc = Start-Process $setup.FullName -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$install")
          if ($proc.ExitCode -ne 0) { throw "安装失败: $($proc.ExitCode)" }
          foreach ($relative in @("AKIA.exe", "_internal\LICENSE", "_internal\NOTICE",
                                  "_internal\THIRD_PARTY_NOTICES.md", "_internal\licenses")) {
            if (-not (Test-Path (Join-Path $install $relative))) { throw "安装包缺少: $relative" }
          }
          $app = Start-Process (Join-Path $install "AKIA.exe") -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited -and $app.ExitCode -ne 0) { throw "启动失败: $($app.ExitCode)" }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
      - name: 生成并校验发布溯源清单
        shell: pwsh
        run: |
          $artifact = (Get-ChildItem "dist\AKIA-Setup-*.exe" | Select-Object -First 1).FullName
          .venv\Scripts\python tools\release_manifest.py --artifact $artifact --output build\release-manifest-windows.json --require-tag --require-clean
          .venv\Scripts\python tools\release_manifest.py --verify build\release-manifest-windows.json --require-tag --require-clean
      - uses: actions/upload-artifact@v4
        with:
          name: AKIA-Windows-Installer
          path: |
            dist/AKIA-Setup-*.exe
            build/release-manifest-windows.json
          retention-days: 30

  sdk-smoke:
    name: SDK / MCP 最低 Python 版本冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装核心哈希锁
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --require-hashes -r requirements.lock
      - name: SDK CLI 回归
        run: .venv/bin/python tools/run_tests.py --files tests/test_sdk_cli.py
      - name: MCP 协议回归
        run: .venv/bin/python tools/run_tests.py --files tests/test_mcp_server.py

  security:
    name: 依赖漏洞审计
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 安装审计工具
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "pip-audit==2.10.1"
      - name: 扫描 CI 哈希锁
        run: |
          .venv/bin/pip-audit \
            --requirement requirements-ci.lock \
            --require-hashes \
            --disable-pip \
            --strict \
            --progress-spinner off
