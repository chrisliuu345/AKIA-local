# 标准 runner 上的工具身份预检。不构建应用或安装包，不上传工件。
# checkout v4.4.0 / 当前 v4: 11d5960a326750d5838078e36cf38b85af677262
# setup-python v5.6.0 / 当前 v5: a26af69be951a213d495a4c3e4e4022e16d87065
# 两个 SHA 于 2026-11-24 从 actions 仓库的 git refs 读出，不是手填的。
name: Tool environment preflight

on:
  push:
    branches:
      - sub/tool-preflight-214c
    paths:
      - .github/workflows/tool-preflight.yml

permissions:
  contents: read

concurrency:
  group: tool-preflight-sub-tool-preflight-214c
  cancel-in-progress: false

jobs:
  preflight-linux:
    name: Ubuntu 24.04 tool identity
    if: github.ref == 'refs/heads/sub/tool-preflight-214c'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          architecture: x64
      - name: Identify tools
        shell: bash
        env:
          TOOL_OS: linux
          REQUESTED_LABEL: ubuntu-24.04
          PRINT_JSON: "1"
          FORCE_EXIT: ""
        run: |
          set +e
          python - <<'PY'
          import hashlib, json, os, platform, shutil, subprocess, sys
          from pathlib import Path

          EXPECTED_APPIMAGE_SHA = "b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2"
          APPIMAGE_URL = "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          STATE = Path(os.environ["RUNNER_TEMP"]) / "akia-tool-preflight-state.json"
          WORK = Path(os.environ["RUNNER_TEMP"]) / "akia-tool-preflight"
          WORK.mkdir(parents=True, exist_ok=True)

          def parse_lock(text):
              import re
              pkgs = []
              cur = None
              def flush():
                  nonlocal cur
                  if cur:
                      pkgs.append(cur)
                      cur = None
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      if cur and cur.get("closed"):
                          flush()
                      continue
                  matched = re.match(r"^([A-Za-z0-9_.-]+)==([^\\\s;]+)(?:\s*;\s*(.*?))?\s*\\?\s*$", line)
                  if matched and not line.startswith("--hash"):
                      if cur:
                          flush()
                      cur = {"name": matched.group(1).lower(), "version": matched.group(2), "marker": (matched.group(3) or "").strip(), "hashes": [], "closed": not line.endswith("\\")}
                      continue
                  found = re.search(r"--hash=sha256:([0-9a-f]{64})", line)
                  if found and cur:
                      cur["hashes"].append(found.group(1))
                      if not line.endswith("\\"):
                          cur["closed"] = True
                  else:
                      raise RuntimeError("unparsed lock line")
              if cur:
                  flush()
              return {item["name"]: item for item in pkgs}

          def run_cmd(argv, env=None, timeout=60, cwd=None):
              try:
                  done = subprocess.run(argv, capture_output=True, text=True, timeout=timeout, env=env, cwd=cwd, check=False)
                  return done.returncode, (done.stdout or "")[:2000], (done.stderr or "")[:2000]
              except Exception as exc:
                  return 1, "", str(exc)[:2000]

          def probe(name, argv):
              exe = shutil.which(argv[0])
              if not exe:
                  return {"name": name, "state": "missing", "exit": 127, "path": None, "version_text": ""}
              code, out, err = run_cmd(argv, timeout=30)
              text = (out or err).strip()
              return {"name": name, "state": "ready" if code == 0 else "not_ready", "exit": code, "path": exe, "version_text": text[:500]}

          report = {
              "package_usable": False,
              "qualification_meaning": "tool_identity_not_package",
              "toolchain_status": "toolchain_partial",
              "runner": {
                  "requested_label": os.environ.get("REQUESTED_LABEL", ""),
                  "os": os.environ.get("RUNNER_OS", ""),
                  "arch": os.environ.get("RUNNER_ARCH", ""),
                  "name": os.environ.get("RUNNER_NAME", ""),
                  "image_os": os.environ.get("ImageOS", ""),
                  "image_version": os.environ.get("ImageVersion", ""),
                  "platform": platform.platform(),
              },
          }
          try:
              machine = platform.machine()
              py_ok = sys.version_info[:2] == (3, 11) and machine in {"x86_64", "AMD64"}
              report["python"] = {"state": "ready" if py_ok else "mismatch", "version": sys.version, "machine": machine, "executable": sys.executable}
              lock_path = Path("requirements-ci.lock")
              locked = parse_lock(lock_path.read_text(encoding="utf-8"))
              pin = locked["pyinstaller"]
              if pin["version"] != "6.22.2" or len(pin["hashes"]) < 1:
                  raise RuntimeError("pyinstaller pin mismatch")
              constraints = WORK / "constraints.txt"
              lines = []
              for item in locked.values():
                  row = f"{item['name']}=={item['version']}"
                  if item["marker"]:
                      row += " ; " + item["marker"]
                  lines.append(row)
              constraints.write_text("\n".join(lines) + "\n", encoding="utf-8")
              venv = WORK / "venv"
              code, out, err = run_cmd([sys.executable, "-m", "venv", str(venv)], timeout=120)
              py = venv / ("Scripts/python.exe" if os.environ.get("TOOL_OS") == "windows" else "bin/python")
              install_code = None
              packages = []
              if code != 0 or not py.exists():
                  py_state = "not_ready"
                  install_out, install_err = out, err
              else:
                  report_path = WORK / "pip-report.json"
                  install_code, install_out, install_err = run_cmd([
                      str(py), "-m", "pip", "install", "--no-cache-dir", "--disable-pip-version-check",
                      "--index-url", "https://pypi.org/simple", "--constraint", str(constraints),
                      "--report", str(report_path), "pyinstaller==6.22.2",
                  ], timeout=300)
                  hash_ok = install_code == 0 and report_path.exists()
                  if report_path.exists():
                      data = json.loads(report_path.read_text(encoding="utf-8"))
                      for item in data.get("install") or []:
                          meta = item.get("metadata") or {}
                          info = item.get("download_info") or {}
                          archive = info.get("archive_info") or {}
                          hashes = archive.get("hashes") or {}
                          digest = hashes.get("sha256")
                          if not digest and str(archive.get("hash", "")).startswith("sha256="):
                              digest = str(archive["hash"]).split("=", 1)[1]
                          name = str(meta.get("name", "")).lower()
                          version = str(meta.get("version", ""))
                          known = locked.get(name)
                          in_lock = bool(known and known["version"] == version and digest in set(known["hashes"]))
                          if not in_lock:
                              hash_ok = False
                          packages.append({"name": name, "version": version, "url": info.get("url"), "sha256": digest, "sha256_in_lock": in_lock})
                  else:
                      hash_ok = False
                  ver_code, ver_out, ver_err = run_cmd([str(py), "-m", "PyInstaller", "--version"], timeout=60)
                  version_text = (ver_out or ver_err).strip()
                  lic = {"bootloader_exception_seen": False, "license_field": "", "excerpt": ""}
                  code2, meta_out, meta_err = run_cmd([str(py), "-c", "import importlib.metadata as m; from pathlib import Path; d=m.distribution('pyinstaller'); print(d.metadata.get('License','')); print('---'); roots=[Path(str(d.locate_file('')))];\nimport PyInstaller\nroots.append(Path(PyInstaller.__file__).resolve().parent)\ntext=''\nfor root in roots:\n p=root\n files=[p] if p.is_file() else list(p.rglob('*'))\n for f in files:\n  if f.is_file() and f.name.lower() in {'copying.txt','license.txt','license.rst','license'}:\n   text=f.read_text(errors='replace')[:4000]; break\n if text: break\nprint(text)"], timeout=60)
                  if code2 == 0:
                      head, _, body = meta_out.partition("---\n")
                      lic["license_field"] = head.strip()[:300]
                      low = body.lower()
                      lic["bootloader_exception_seen"] = "bootloader" in low and "exception" in low
                      start = low.find("bootloader")
                      lic["excerpt"] = body[max(0, start - 120):start + 500].strip()[:700]
                  version_ok = ver_code == 0 and version_text.startswith("6.22.2")
                  named = {pkg["name"] for pkg in packages}
                  py_state = "ready" if hash_ok and version_ok and "pyinstaller" in named and lic["bootloader_exception_seen"] else "partial" if install_code == 0 else "not_ready"
                  report["pyinstaller"] = {
                      "state": py_state, "requested": "6.22.2", "version_text": version_text, "version_exit": ver_code,
                      "install_exit": install_code, "packages": packages, "license": lic,
                      "note": "pip install does not make a package; no PyInstaller build was run",
                  }
              if "pyinstaller" not in report:
                  report["pyinstaller"] = {"state": "not_ready", "requested": "6.22.2", "install_exit": install_code, "venv_exit": code, "stdout": install_out[:500], "stderr": install_err[:500]}
              if os.environ.get("TOOL_OS") == "linux":
                  pin_file = Path("packaging/appimagetool.sha256").read_text(encoding="utf-8").strip()
                  tool = {"url": APPIMAGE_URL, "expected_sha256": EXPECTED_APPIMAGE_SHA, "pin_file_sha256": pin_file, "state": "not_ready", "download_exit": None, "executed": False,
                          "license": {"project": "AppImageKit LICENSE is MIT for original source unless a file says otherwise. It does not cover every dependency, and it does not cover contents of AppImages created with the tool.",
                                      "runtime": "type2-runtime LICENSE is MIT and states the runtime statically links musl, libfuse (LGPL-2), squashfuse, libzstd, and zlib.",
                                      "blob_license_extracted": False, "continuous_reproducible": False, "mit_covers_entire_blob": False,
                                      "no_fuse": "Official docs document --appimage-extract-and-run and APPIMAGE_EXTRACT_AND_RUN=1 for type 2 AppImages."}}
                  if pin_file != EXPECTED_APPIMAGE_SHA:
                      tool["state"] = "not_ready"
                      tool["reason"] = "pin_file_mismatch"
                  else:
                      dest = WORK / "appimagetool-x86_64.AppImage"
                      dl, dl_out, dl_err = run_cmd(["curl", "--fail", "--location", "--retry", "0", "--max-time", "180", "--output", str(dest), APPIMAGE_URL], timeout=200)
                      tool["download_exit"] = dl
                      tool["download_stderr"] = dl_err[:400]
                      if dl == 0 and dest.exists():
                          actual = hashlib.sha256(dest.read_bytes()).hexdigest()
                          tool["actual_sha256"] = actual
                          if actual == EXPECTED_APPIMAGE_SHA:
                              dest.chmod(0o755)
                              env = os.environ.copy()
                              env["APPIMAGE_EXTRACT_AND_RUN"] = "1"
                              vcode, vout, verr = run_cmd([str(dest), "--version"], env=env, timeout=90, cwd=str(WORK))
                              rcode, rout, rerr = run_cmd([str(dest), "--appimage-version"], env=env, timeout=90, cwd=str(WORK))
                              tool["version_exit"] = vcode
                              tool["version_text"] = (vout or verr).strip()[:500]
                              tool["runtime_exit"] = rcode
                              tool["runtime_text"] = (rout or rerr).strip()[:500]
                              tool["executed"] = True
                              tool["state"] = "ready" if vcode == 0 and tool["version_text"] else "partial"
                          else:
                              tool["state"] = "not_ready"
                              tool["reason"] = "hash_mismatch"
                              dest.unlink(missing_ok=True)
                      else:
                          tool["state"] = "not_ready"
                          tool["reason"] = "download_failed"
                  report["appimagetool"] = tool
                  report["system_tools"] = [
                      probe("dpkg-deb", ["dpkg-deb", "--version"]),
                      probe("rpmbuild", ["rpmbuild", "--version"]),
                      probe("ldd", ["ldd", "--version"]),
                      probe("objdump", ["objdump", "--version"]),
                  ]
              required_ok = report["python"]["state"] == "ready" and report["pyinstaller"]["state"] == "ready"
              if os.environ.get("TOOL_OS") == "linux":
                  required_ok = required_ok and report["appimagetool"]["state"] == "ready" and all(item["state"] == "ready" for item in report["system_tools"])
              report["toolchain_status"] = "toolchain_ready" if required_ok else "toolchain_partial"
          except Exception as exc:
              report["error"] = str(exc)[:1000]
              report["toolchain_status"] = "toolchain_partial"
          STATE.write_text(json.dumps(report, indent=2), encoding="utf-8")
          if os.environ.get("PRINT_JSON") == "1":
              print(json.dumps(report, indent=2))
          sys.exit(0 if report["toolchain_status"] == "toolchain_ready" else 2)
          PY
          code=$?
          if [ "${FORCE_EXIT}" = "0" ]; then
            exit 0
          fi
          exit "$code"

