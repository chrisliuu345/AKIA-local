                      probe("rpmbuild", ["rpmbuild", "--version"]),
                      probe("ldd", ["ldd", "--version"]),
                      probe("objdump", ["objdump", "--version"]),
                  ]
              required_ok = report["python"]["state"] == "ready" and report["pyinstaller"]["state"] == "ready"
              if os.environ.get("TOOL_OS") == "linux":
                  required_ok = required_ok and report["appimagetool"]["state"] == "ready" and all(item["state"] == "ready" for item in report["system_tools"])
              report["toolchain_status"] = "toolchain_ready" if required_ok else "toolchain_partial"
          except Exception as exc:
              report["error"] = str(exc)[:1000]
              report["toolchain_status"] = "toolchain_partial"
          STATE.write_text(json.dumps(report, indent=2), encoding="utf-8")
          if os.environ.get("PRINT_JSON") == "1":
              print(json.dumps(report, indent=2))
          sys.exit(0 if report["toolchain_status"] == "toolchain_ready" else 2)
          PY
          code=$?
          if [ "${FORCE_EXIT}" = "0" ]; then
            exit 0
          fi
          exit "$code"
      - name: Identify ISCC and conclude
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $statePath = Join-Path $env:RUNNER_TEMP "akia-tool-preflight-state.json"
          $isccPath = Join-Path $env:RUNNER_TEMP "akia-iscc.json"
          $candidates = @()
          foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
            if ($root) {
              $cand = Join-Path $root "Inno Setup 6\ISCC.exe"
              if (Test-Path -LiteralPath $cand) { $candidates += $cand }
            }
          }
          $lib = "C:\ProgramData\chocolatey\lib"
          if (Test-Path -LiteralPath $lib) {
            $dirs = @(Get-ChildItem -LiteralPath $lib -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "(?i)inno" })
            foreach ($dir in $dirs) {
              $hits = @(Get-ChildItem -LiteralPath $dir.FullName -Filter ISCC.exe -File -Recurse -Depth 4 -ErrorAction SilentlyContinue)
              foreach ($hit in $hits) { $candidates += $hit.FullName }
            }
          }
          $commandPath = $null
          $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($cmd) { $commandPath = $cmd.Source }
          $real = $candidates | Where-Object { $_ -notmatch "\\chocolatey\\bin\\" } | Select-Object -First 1
          $facts = [ordered]@{
            usable = $false
            approved = $false
            command_path = $commandPath
            real_path = $real
            candidates = @($candidates)
            state = "missing"
            help_exit = $null
            help_exit_class = "missing"
            banner_identity = $null
            banner_proves_exact_version = $false
            file_version = $null
            product_version = $null
            product_name = $null
            shim_file_version = $null
            license_excerpt = $null
            mandatory_purchase_clause = "not_read"
            banner = $null
          }
          if ($commandPath -and $commandPath -match "\\chocolatey\\bin\\") {
            $facts.shim_file_version = (Get-Item -LiteralPath $commandPath).VersionInfo.FileVersion
          }
          if ($real) {
            $info = (Get-Item -LiteralPath $real).VersionInfo
            $facts.file_version = $info.FileVersion
            $facts.product_version = $info.ProductVersion
            $facts.product_name = $info.ProductName
            $help = & $real /? 2>&1 | Out-String
            $helpCode = $LASTEXITCODE
            if ($null -eq $helpCode) { $helpCode = 0 }
            $facts.help_exit = $helpCode
            $facts.banner = ($help -split "`r?`n" | Select-Object -First 8) -join "`n"
            if ($helpCode -eq 1 -and $help -match "Inno Setup 6") {
              $facts.help_exit_class = "identified_inno6_family"
              $facts.banner_identity = "inno6_family"
            } elseif ($helpCode -ne 0) {
              $facts.help_exit_class = "failure"
            } else {
              $facts.help_exit_class = "exit_zero"
            }
            $licenseFile = Join-Path (Split-Path -Parent $real) "license.txt"
            if (Test-Path -LiteralPath $licenseFile) {
              $excerpt = @(Get-Content -LiteralPath $licenseFile -TotalCount 40)
              $facts.license_excerpt = ($excerpt -join "`n")
              $joined = $facts.license_excerpt
              if ($joined -match "(?i)must purchase|required to purchase|shall purchase") {
                $facts.mandatory_purchase_clause = "seen"
              } else {
                $facts.mandatory_purchase_clause = "not_found_in_local_excerpt"
              }
            } else {
              $facts.mandatory_purchase_clause = "license_file_missing"
            }
            if ($facts.file_version) { $facts.state = "identified" } else { $facts.state = "partial" }
          }
          $facts | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $isccPath -Encoding utf8
          python -c "import json,os,pathlib,sys; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'akia-tool-preflight-state.json'; q=pathlib.Path(os.environ['RUNNER_TEMP'])/'akia-iscc.json'; base=json.loads(p.read_text(encoding='utf-8-sig')) if p.exists() else {'package_usable':False,'toolchain_status':'toolchain_partial','error':'python state missing'}; iscc=json.loads(q.read_text(encoding='utf-8-sig')); base['iscc']=iscc; base['package_usable']=False; ok=base.get('python',{}).get('state')=='ready' and base.get('pyinstaller',{}).get('state')=='ready' and iscc.get('state')=='identified'; base['toolchain_status']='toolchain_ready' if ok else 'toolchain_partial'; print(json.dumps(base, indent=2)); sys.exit(0 if ok else 2)"
          $code = $LASTEXITCODE
          if ($null -eq $code) { $code = 1 }
          exit $code
