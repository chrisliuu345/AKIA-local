# ruff 配置 — AKIA lint 门禁
# 基础: F(含 F841 未用变量) + E9 语法 + B 常见陷阱 + 遗留单行风格 E701/E702/E402
# 追加高信号规则（2026-09-13 全量质量审查后加入，均已清零）:
#   T10 调试器残留 / ISC 隐式字符串拼接（缺逗号陷阱） / PIE 常见简化
#   RUF012 类级可变属性（可能跨实例共享） / RUF021 and-or 优先级 / RUF034 无效 if-else
#   RUF059 未使用的解包变量 / PLW1510 subprocess 未显式 check
#   PLW2901 循环变量被覆盖 / PLW0602 global 声明但未赋值
# 全库门禁: ruff check . 须零告警 (CI 与本地开发共用)

[lint]
select = [
    "F", "E9", "B", "E701", "E702", "E402",
    "T10", "ISC", "PIE",
    "RUF012", "RUF021", "RUF034", "RUF059",
    "PLW1510", "PLW2901", "PLW0602",
    # 盲除异常棘轮（2026-09-22, v4.2.0 P3-3）：算法与报告层
    # （analysis/output/config/tools）已逐处补理由清零，新代码再出现即门禁失败；
    # core/ui 等存量目录见 [lint.per-file-ignores]，按 PLAN_v4.2.0.md 逐步收敛
    "BLE001",
    # 类型现代化（2026-09-15 全量迁移：PEP 585/604 注解 + 弃用 typing 导入 + 隐式 Optional）
    "UP", "RUF013",
    # 全量质量审查（2026-09-28，中间版本）新增棘轮 —— 全部清零后入闸：
    #   RET505/RET506 return/raise 之后的多余 else（扁平化控制流）
    #   SIM105 用 contextlib.suppress 表达"有意吞异常"，SIM113 用 enumerate 维护计数
    #   SIM114 相同分支合并，SIM201 取反比较可读化
    #   C408/C416/C420 冗余构造与推导式，PERF102 字典迭代改 .items()
    #   PLW0108 冗余 lambda，PLW3301 嵌套 min/max
    #   RUF010 f-string 显式类型转换
    #   RUF100 冗余 noqa：强制"指令真实有效"，理由文本保留为普通注释
    #   注：PERF401（手写 append 循环→推导式/extend）尚有 60 处存量，
    #   2026-09-28 分批清理中，未入闸；新代码请直接用推导式
    "RET505", "RET506", "RUF010", "RUF100",
    "SIM105", "SIM113", "SIM114", "SIM201",
    "C408", "C416", "C420", "PERF102", "PLW0108", "PLW3301",
]
exclude = [".venv", "build", "dist"]

[lint.per-file-ignores]
# 测试桩类常用类级可变属性（如调用记录列表），属有意为之
"tests/*.py" = ["RUF012", "BLE001"]
# 盲除异常存量（`rg -c 'except Exception'` 口径，2026-09-28 实测）：core 90 · ui 128 ·
# firmware 14 · connectors 6 · server 1 · 根文件 2
# 多数存量自带"为什么可以宽异常"的理由注释；2026-09-28 起这些目录里失效的
# `# noqa: BLE001` 指令已降级为普通理由注释（RUF100 入闸，见 select 段注释）。
# 收敛顺序：core/agent 与 core/streaming（含日志）→ core/devices → connectors/server → ui
"core/*.py" = ["BLE001"]
"core/**/*.py" = ["BLE001"]
"ui/*.py" = ["BLE001"]
"ui/**/*.py" = ["BLE001"]
"connectors/*.py" = ["BLE001"]
"connectors/**/*.py" = ["BLE001"]
"server/*.py" = ["BLE001"]
# 设备端固件脚本（MicroPython，硬件循环里需吞异常保持采集）
"firmware/*.py" = ["BLE001"]
"main.py" = ["BLE001"]
"build_pyinstaller.py" = ["BLE001"]
