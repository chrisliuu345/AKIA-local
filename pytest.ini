[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --color=yes
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gui: marks tests requiring GUI (QApplication)
    requires_socket: marks tests needing local socket binding (auto-skipped when unavailable)
    requires_keyring: marks tests needing a system keyring backend (auto-skipped when unavailable)
    requires_server: marks tests needing FastAPI/uvicorn (pip install -r requirements-server.txt)
